name: Build

on:
  workflow_dispatch:
    inputs:
      publish-release:
        description: 'Publish Release'
        type: boolean
        default: false
      publish-pre-release:
        description: 'Mark as Pre-Release'
        type: boolean
        default: false
      version-number:
        description: 'Version Number for Release'
        type: string
        default: '0.1.2'
      release-name-info:
        description: 'Additional info to put at the end of the release name'
        type: string
        required: false
      release-notes:
        description: 'Release notes, auto generated if not given'
        type: string
        required: false
      publish-steam:
        description: 'Publish on Steam'
        type: boolean
        default: false

jobs:
  build-linux:
    name: ${{ matrix.name }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - { name: steamrt4-x64, result: Baballonia-Next-linux-x64.tar.xz, runs-on: ubuntu-22.04, upload-path: src/Baballonia.Desktop/bin/Baballonia-Next-linux-x64.tar.xz, arch: linux-x64, container: "registry.gitlab.steamos.cloud/steamrt/steamrt4/sdk:latest" }
          - { name: steamrt4-arm, result: Baballonia-Next-linux-arm64.tar.xz, runs-on: ubuntu-22.04-arm, upload-path: src/Baballonia.Desktop/bin/Baballonia-Next-linux-arm64.tar.xz, arch: linux-arm64, container: "registry.gitlab.steamos.cloud/steamrt/steamrt4/sdk/arm64:latest" }

    runs-on: ${{ matrix.runs-on }}

    # Build inside the Steam Runtime 4 SDK so the artifact is produced against the
    # steamrt4 (Debian 13 'trixie') ABI the app actually runs under at launch,
    # rather than the host ubuntu image. steamrt4 deliberately omits ICU and ships
    # libv4l2 only as libv4l2.so.0 — the app now carries app-local ICU and resolves
    # V4L2 via libc, so the published self-contained build runs there unmodified.
    container:
      image: ${{ matrix.container }}

    env:
      # steamrt4 has no ICU, so the .NET *build* CLI can't initialise globalization
      # in this container — run the build tooling invariant. This only affects the
      # build process; the published app still ships its own ICU and sets
      # System.Globalization.AppLocalIcu in its runtimeconfig (see Desktop.csproj).
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      # git/curl/unzip are needed by checkout (submodules), the .NET installer, and
      # download_dependencies.sh. Installed from the SDK's preconfigured apt repo.
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl unzip xz-utils ca-certificates patchelf

      - name: Checkout latest
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - name: Install .NET SDK
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 10.0 --install-dir /usr/share/dotnet
          echo "/usr/share/dotnet" >> "$GITHUB_PATH"

      - name: Download dependencies
        run: ./download_dependencies.sh

      - name: Run publish
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version-number }}
        run: |
          cd src/Baballonia.Desktop
          version="${RELEASE_VERSION:-0.1.2}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Semantic Version: $version"
            exit 1
          fi
          numeric_version="${version%%[-+]*}"
          file_version="${numeric_version}.0"
          dotnet publish -r ${{ matrix.arch }} -c Release --self-contained -f net10.0 \
            -p:Version="$version" -p:AssemblyVersion="$file_version" -p:FileVersion="$file_version"
          cd "bin/Release/net10.0/${{ matrix.arch }}/publish"
          tar -cJf ./../../../../${{ matrix.result }} *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.result }}
          path: ${{ matrix.upload-path }}

  build-windows-x64:
    defaults:
      run:
        shell: bash

    runs-on: windows-2022

    steps:
      - name: Checkout latest
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          lfs: true

      - name: Download dependencies
        shell: pwsh
        run: ./download_dependencies.ps1

      - name: Build project
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version-number }}
        run: |
          cd src/Baballonia.Desktop
          version="${RELEASE_VERSION:-0.1.2}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Semantic Version: $version"
            exit 1
          fi
          numeric_version="${version%%[-+]*}"
          file_version="${numeric_version}.0"
          dotnet publish -r win-x64 -c Release --self-contained -f net10.0 \
            -p:Version="$version" -p:AssemblyVersion="$file_version" -p:FileVersion="$file_version"
          cd "bin/Release/net10.0/win-x64/publish"
          tar -cJf ./../../../../Baballonia-Next-win-x64.tar.xz *

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install --tool-path .tools vpk --version 1.2.0

      - name: Build installer, portable archive, and update feed
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version-number }}
          RELEASE_NOTES: ${{ github.event.inputs.release-notes }}
        run: |
          $desktopDirectory = Join-Path $env:GITHUB_WORKSPACE 'src/Baballonia.Desktop'
          $publishDirectory = Join-Path $desktopDirectory 'bin/Release/net10.0/win-x64/publish'
          $releaseDirectory = Join-Path $desktopDirectory 'Releases'
          $releaseNotesFile = Join-Path $desktopDirectory 'release-notes.md'
          $notes = if ([string]::IsNullOrWhiteSpace($env:RELEASE_NOTES)) {
            "Baballonia Next $env:RELEASE_VERSION"
          } else {
            $env:RELEASE_NOTES
          }

          Set-Content -LiteralPath $releaseNotesFile -Value $notes -Encoding utf8

          & "$env:GITHUB_WORKSPACE/.tools/vpk.exe" pack `
            --packId Baballonia.Next `
            --packTitle "Baballonia Next" `
            --packVersion $env:RELEASE_VERSION `
            --packDir $publishDirectory `
            --mainExe Baballonia.Desktop.exe `
            --outputDir $releaseDirectory `
            --channel win-x64 `
            --runtime win-x64 `
            --icon (Join-Path $desktopDirectory 'Assets/IconOpaque.ico') `
            --releaseNotes $releaseNotesFile

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          Move-Item -LiteralPath (Join-Path $releaseDirectory 'Baballonia.Next-win-x64-Setup.exe') `
            -Destination (Join-Path $releaseDirectory "Baballonia-Next-$env:RELEASE_VERSION-Setup-x64.exe")
          Move-Item -LiteralPath (Join-Path $releaseDirectory 'Baballonia.Next-win-x64-Portable.zip') `
            -Destination (Join-Path $releaseDirectory "Baballonia-Next-$env:RELEASE_VERSION-Portable-win-x64.zip")

          $assetsFile = Join-Path $releaseDirectory 'assets.win-x64.json'
          $assets = Get-Content -LiteralPath $assetsFile -Raw | ConvertFrom-Json
          foreach ($asset in $assets) {
            if ($asset.Type -eq 'Installer') {
              $asset.RelativeFileName = "Baballonia-Next-$env:RELEASE_VERSION-Setup-x64.exe"
            } elseif ($asset.Type -eq 'Portable') {
              $asset.RelativeFileName = "Baballonia-Next-$env:RELEASE_VERSION-Portable-win-x64.zip"
            }
          }
          $assets | ConvertTo-Json -Compress | Set-Content -LiteralPath $assetsFile -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "Baballonia-Next-windows-release"
          path: "src/Baballonia.Desktop/Releases/*"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: "Baballonia-Next-win-x64.tar.xz"
          path: "src/Baballonia.Desktop/bin/Baballonia-Next-win-x64.tar.xz"

  publish-release:
    needs: [build-linux, build-windows-x64]
    if: ${{ github.event.inputs.publish-release == 'true' }}
    defaults:
      run:
        shell: bash

    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Validate version number exists
        run: |
          if [ -z "${{ github.event.inputs.version-number }}" ]; then
            exit 1
          fi

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: "Baballonia-Next-windows-release"
          path: ./artifacts

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: Baballonia-Next-linux-x64.tar.xz
          path: ./artifacts

      - name: Download Linux ARM artifact
        uses: actions/download-artifact@v4
        with:
          name: Baballonia-Next-linux-arm64.tar.xz
          path: ./artifacts

      - name: Rename artifacts
        env:
          VERSION: ${{ github.event.inputs.version-number }}
        run: |
          cd artifacts
          mv "Baballonia-Next-linux-x64.tar.xz" "Baballonia-Next-${VERSION}-linux-x64.tar.xz"
          mv "Baballonia-Next-linux-arm64.tar.xz" "Baballonia-Next-${VERSION}-linux-arm64.tar.xz"

      - name: Set dynamic release name
        id: release-name
        run: |
          if [[ -z "${{ github.event.inputs.release-name-info }}" ]]; then
            echo "name=Baballonia Next ${{ github.event.inputs.version-number }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=Baballonia Next ${{ github.event.inputs.version-number }} - ${{ github.event.inputs.release-name-info }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set release body or generate notes
        id: release-body
        run: |
          if [[ -z "${{ github.event.inputs.release-notes }}" ]]; then
            echo "generate_notes=true" >> "$GITHUB_OUTPUT"
            echo "body=" >> "$GITHUB_OUTPUT"
          else
            echo "generate_notes=false" >> "$GITHUB_OUTPUT"
            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            echo "${{ github.event.inputs.release-notes }}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: v${{ github.event.inputs.version-number }}
          name: ${{ steps.release-name.outputs.name }}
          prerelease: ${{ github.event.inputs.publish-pre-release }}
          body: ${{ steps.release-body.outputs.body }}
          generate_release_notes: ${{ steps.release-body.outputs.generate_notes }}

  publish-steam:
    needs: [build-linux, build-windows-x64]
    if: ${{ github.event.inputs.publish-steam == 'true' }}
    defaults:
      run:
        shell: bash

    runs-on: ubuntu-22.04

    steps:
      - name: Validate version number exists
        run: |
          if [ -z "${{ github.event.inputs.version-number }}" ]; then
            exit 1
          fi

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Baballonia-Next-win-x64.tar.xz
          path: ./artifacts

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: Baballonia-Next-linux-x64.tar.xz
          path: ./artifacts

      #- name: Download Linux ARM artifact
      #  uses: actions/download-artifact@v4
      #  with:
      #    name: Baballonia-Next-linux-arm64.tar.xz
      #    path: ./artifacts

      - name: Untar artifacts
        run: |
          mkdir -p ./builds/windows
          mkdir -p ./builds/linux-x64
          tar -xf ./artifacts/Baballonia-Next-win-x64.tar.xz --directory ./builds/windows
          tar -xf ./artifacts/Baballonia-Next-linux-x64.tar.xz --directory ./builds/linux-x64

      - name: Upload to Steam
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: 4091970
          buildDescription: ${{ github.event.inputs.version-number }}
          depot2Path: builds/windows
          depot3Path: builds/linux-x64
          releaseBranch: prerelease
